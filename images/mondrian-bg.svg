<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450">
  <defs>
    <pattern id="checkerboard" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#eaf1fb"/>
      <rect width="20" height="20" fill="#aecbe8"/>
      <rect x="20" y="20" width="20" height="20" fill="#aecbe8"/>
    </pattern>
    <pattern id="dotsLav" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#eae6f7"/>
      <circle cx="6" cy="6" r="2.4" fill="#8f7fc4"/>
      <circle cx="18" cy="14" r="2.4" fill="#8f7fc4"/>
      <circle cx="9" cy="19" r="2.4" fill="#8f7fc4"/>
    </pattern>
    <pattern id="crosshatchOlive" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#eef2c9"/>
      <path d="M0 9h18M9 0v18" stroke="#b7c25a" stroke-width="2"/>
      <circle cx="9" cy="9" r="1.6" fill="#e0b23a"/>
    </pattern>
    <pattern id="plaidTeal" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#e3f2f2"/>
      <rect width="30" height="6" fill="#f6c9c9"/>
      <rect y="18" width="30" height="6" fill="#f6c9c9"/>
      <rect width="6" height="30" fill="#7fb8a8"/>
      <rect x="18" width="6" height="30" fill="#7fb8a8"/>
    </pattern>
    <pattern id="plaidPurple" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#ece3f5"/>
      <rect width="26" height="5" fill="#b79ee0"/>
      <rect y="15" width="26" height="5" fill="#b79ee0"/>
      <rect width="5" height="26" fill="#9c7fd1"/>
      <rect x="15" width="5" height="26" fill="#9c7fd1"/>
    </pattern>
    <pattern id="stripeDotsPink" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="28" height="28" fill="#fbeaf1"/>
      <rect width="10" height="28" fill="#f0a8c4"/>
      <circle cx="20" cy="7" r="2" fill="#e07fa8"/>
      <circle cx="20" cy="21" r="2" fill="#e07fa8"/>
    </pattern>
    <pattern id="fringe" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="14" height="10" fill="none"/>
      <line x1="7" y1="0" x2="7" y2="10" stroke="#e0995a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1000" height="1450" fill="#f7f3ec"/>

  <!-- structural mondrian rules (thin ink lines forming the empty grid) -->
  <g stroke="#2b2b28" stroke-width="2" fill="none" opacity="0.55">
    <line x1="20" y1="148" x2="965" y2="148"/>
    <line x1="20" y1="148" x2="20" y2="1435"/>
    <line x1="965" y1="148" x2="965" y2="1435"/>
    <line x1="20" y1="1435" x2="965" y2="1435"/>

    <line x1="160" y1="148" x2="160" y2="415"/>
    <line x1="20" y1="330" x2="160" y2="330"/>
    <rect x="22" y="150" width="115" height="35" />

    <line x1="455" y1="148" x2="455" y2="330"/>
    <rect x="460" y="245" width="235" height="85"/>
    <line x1="695" y1="255" width="270" height="6" y2="255"/>
    <rect x="700" y="252" width="260" height="8" fill="url(#fringe)"/>

    <line x1="20" y1="415" x2="965" y2="415"/>
    <line x1="315" y1="330" x2="315" y2="800"/>
    <line x1="305" y1="330" x2="305" y2="800"/>
    <line x1="300" y1="330" x2="300" y2="800"/>

    <line x1="20" y1="800" x2="600" y2="800"/>
    <line x1="600" y1="800" x2="600" y2="1050"/>
    <line x1="90" y1="1050" x2="620" y2="1050"/>
    <line x1="90" y1="1000" x2="90" y2="1050"/>
    <rect x="80" y="1000" width="22" height="50"/>

    <line x1="925" y1="800" x2="965" y2="800"/>

    <line x1="20" y1="1130" x2="380" y2="1130"/>
    <line x1="380" y1="1130" x2="380" y2="1235"/>
    <line x1="195" y1="1235" x2="395" y2="1235"/>
    <rect x="400" y="1235" width="110" height="90"/>
  </g>

  <!-- zigzag divider strip -->
  <polyline points="195,1224 210,1214 225,1234 240,1214 255,1234 270,1214 285,1234 300,1214 315,1234 330,1214 345,1234 360,1214 375,1234 390,1224"
    fill="none" stroke="#8fbf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- solid & patterned accent blocks -->
  <rect x="150" y="330" width="42" height="38" fill="#f0a8a0"/>                       <!-- coral square -->
  <rect x="160" y="415" width="155" height="135" fill="url(#checkerboard)"/>          <!-- blue checkerboard -->
  <rect x="420" y="340" width="42" height="88" fill="url(#dotsLav)"/>                 <!-- lavender dots -->
  <rect x="715" y="408" width="172" height="172" fill="url(#crosshatchOlive)"/>       <!-- olive crosshatch -->
  <rect x="925" y="415" width="40" height="385" fill="#8fa3d1"/>                      <!-- blue bar -->
  <rect x="400" y="535" width="292" height="175" fill="#c9ecdd"/>                     <!-- mint feature block -->
  <rect x="55" y="672" width="212" height="34" fill="#e07fa8"/>                       <!-- magenta bar -->

  <!-- stacked circle accent -->
  <circle cx="483" cy="712" r="12" fill="#f0b84a"/>
  <circle cx="483" cy="736" r="12" fill="#e0703a"/>
  <circle cx="483" cy="760" r="12" fill="#f2d24a"/>
  <circle cx="483" cy="784" r="12" fill="#e0703a"/>

  <rect x="740" y="955" width="185" height="112" fill="url(#plaidTeal)"/>             <!-- teal plaid -->
  <rect x="155" y="1120" width="115" height="28" fill="#e08a5a"/>                     <!-- coral bar -->
  <rect x="55" y="1195" width="130" height="178" fill="url(#stripeDotsPink)"/>        <!-- pink stripe+dots -->
  <rect x="775" y="1180" width="75" height="45" fill="#d9a8d9"/>                      <!-- lavender rect -->
  <rect x="825" y="1345" width="140" height="88" fill="url(#plaidPurple)"/>           <!-- purple plaid -->

  <!-- outline-only empty cells (unfilled paper) -->
  <g stroke="#2b2b28" stroke-width="1.5" fill="#f7f3ec" opacity="0.9">
    <rect x="22" y="150" width="115" height="35"/>
    <rect x="460" y="245" width="235" height="85"/>
    <rect x="80" y="1000" width="22" height="50"/>
    <rect x="400" y="1235" width="110" height="90"/>
  </g>
</svg>
