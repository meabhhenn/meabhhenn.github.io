  When you have your first publication/poster/preprint:
    1. Fill in a .pub block below (copy it for each entry).
    2. Add this to the <nav> on index.html AND work.html (between Work and CV):
         <a href="publications.html">Publications</a>
  Academic convention: authors, "Title," venue, year — and underline/bold YOUR name.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Publications by Meabh Hennessy.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='%231fbf3a'/></svg>">
<title>Publications — Meabh Hennessy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f9faf8; --ink:#16181b; --slate:#565c63; --faint:#8a9097; --line:#e3e5e1; --accent:#2b4a7a; --black:#0e0f12; --neon:#1fbf3a; --display:"Schibsted Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.65; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
  .wrap{ max-width:760px; width:100%; margin:0 auto; padding:0 32px; }
  .topnav{ border-bottom:1px solid var(--line); }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:22px 0; gap:18px; }
  .brand{ font-family:var(--display); font-weight:600; font-size:1rem; letter-spacing:-.01em; text-decoration:none; }
  .topnav nav{ display:flex; gap:26px; }
  .topnav nav a{ font-size:.84rem; color:var(--slate); text-decoration:none; letter-spacing:.03em; transition:color .15s ease; }
  .topnav nav a:hover{ color:var(--accent); }
  .topnav nav a[aria-current]{ color:var(--ink); }
  .page-head{ padding:64px 0 36px; }
  .page-head .eyebrow{ font-size:.76rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-bottom:18px; }
  .page-head h1{ font-family:var(--display); font-weight:600; font-size:clamp(2.1rem,6vw,3rem); letter-spacing:-.025em; }
  .pubs{ padding-bottom:72px; }
  .pub{ padding:22px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr; gap:4px; }
  .pub .year{ font-size:.8rem; color:var(--faint); }
  .pub .title{ font-family:var(--display); font-weight:600; font-size:1.15rem; letter-spacing:-.01em; }
  .pub .authors{ color:var(--slate); font-size:.95rem; }
  .pub .authors .me{ color:var(--ink); font-weight:500; text-decoration:underline; }
  .pub .venue{ color:var(--slate); font-size:.95rem; font-style:italic; }
  .pub .links a{ font-size:.84rem; color:var(--accent); text-decoration:none; margin-right:16px; border-bottom:1px solid transparent; }
  .pub .links a:hover{ border-bottom-color:var(--accent); }
  .empty{ color:var(--slate); padding:22px 0; border-top:1px solid var(--line); }
  footer{ background:var(--black); color:var(--bg); }
  footer .wrap{ padding:46px 32px; display:flex; align-items:baseline; gap:14px 26px; flex-wrap:wrap; }
  .contact-label{ font-family:var(--display); font-weight:500; font-size:1.05rem; color:var(--bg); margin-right:6px; }
  footer a{ font-size:.95rem; color:#d7dad6; text-decoration:none; border-bottom:1px solid transparent; padding-bottom:2px; transition:color .15s ease, border-color .15s ease; }
  footer a:hover{ color:var(--neon); border-bottom-color:var(--neon); }
  @media (min-width:640px){ .pub{ grid-template-columns:90px 1fr; gap:0 28px; } .pub .year{ grid-row:1/span 4; padding-top:3px; } }
</style>
</head>
<body>
  <header class="topnav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html">Meabh Hennessy</a>
      <nav>
        <a href="index.html#about">About</a>
        <a href="work.html">Work</a>
        <a href="publications.html" aria-current="page">Publications</a>
        <a href="[cv.pdf]" target="_blank" rel="noopener">CV</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="wrap"><p class="eyebrow">Publications</p><h1>Publications</h1></div>
    </section>

    <section class="wrap pubs">
      <!-- When you have nothing yet, keep this line; delete it once you add entries: -->
      <p class="empty">Coming soon.</p>

      <!-- ENTRY TEMPLATE — copy one block per publication:
      <article class="pub">
        <span class="year">2026</span>
        <div>
          <div class="title">[Paper title]</div>
          <div class="authors"><span class="me">M. Hennessy</span>, A. Coauthor, B. Coauthor</div>
          <div class="venue">[Venue / conference / journal]</div>
          <div class="links"><a href="[pdf]">PDF</a><a href="[doi or arxiv]">Link</a></div>
        </div>
      </article>
      -->
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span class="contact-label">Contact me:</span>
      <a href="mailto:[you@email.com]">[you@email.com]</a>
      <a href="[https://github.com/you]">GitHub</a>
      <a href="[https://linkedin.com/in/you]">LinkedIn</a>
    </div>
  </footer>
</body>
</html>
